<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register — Campus Fix</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-icon">🔧</div>
        <h1>Create your account</h1>
        <p>Register as a Student, Faculty, Maintenance Staff, or Administrator</p>
      </div>

      <div class="alert alert-error" id="errorAlert"></div>

      <div class="role-toggle">
        <button type="button" class="active" data-role="student">🎒 Student</button>
        <button type="button" data-role="faculty">🧑‍🏫 Faculty</button>
        <button type="button" data-role="maintenance">🛠️ Maintenance</button>
        <button type="button" data-role="admin">🛡️ Admin</button>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label>Full name</label>
          <input type="text" id="name" placeholder="Jane Doe" required />
        </div>
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="email" placeholder="you@campusfix.edu" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label id="idLabel">Roll / ID number</label>
            <input type="text" id="idNumber" placeholder="e.g. STU202610" />
          </div>
          <div class="form-group">
            <label>Department / Trade</label>
            <input type="text" id="department" placeholder="e.g. Computer Science / Electrical" />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
      <p class="auth-switch"><a href="../index.html">&larr; Back to home</a></p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    let selectedRole = "student";
    document.querySelectorAll(".role-toggle button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".role-toggle button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedRole = btn.dataset.role;
        document.getElementById("idLabel").textContent =
          selectedRole === "student" ? "Roll number" : (selectedRole === "faculty" ? "Faculty ID" : (selectedRole === "admin" ? "Admin Employee ID" : "Staff / Tech ID"));
      });
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorAlert = document.getElementById("errorAlert");
      errorAlert.classList.remove("show");
      const btn = document.getElementById("registerBtn");
      btn.disabled = true; btn.textContent = "Creating account...";

      try {
        const resp = await api.register({
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          role: selectedRole,
          department: document.getElementById("department").value.trim(),
          id_number: document.getElementById("idNumber").value.trim(),
        });
        const user = resp.data || resp.user;
        window.location.href = dashboardUrlForRole(user.role);
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.add("show");
        btn.disabled = false; btn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
