name: Campus Fix CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Package WAR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Grant execute permission for Maven Wrapper
      run: chmod +x mvnw

    - name: Execute JUnit 5 Tests
      run: ./mvnw clean test

    - name: Package Production WAR
      run: ./mvnw package -DskipTests

    - name: Upload WAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: campus-fix-war
        path: target/campus-fix.war
        retention-days: 5
