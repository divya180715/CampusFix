# SonarQube Scanner Configuration for Campus Fix
sonar.projectKey=campus-fix
sonar.projectName=Campus Fix - Smart Campus Complaint and Maintenance Management System
sonar.projectVersion=1.0.0

# Source & Test Code Paths
sonar.sources=src/main/java,src/main/webapp
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Source Encoding
sonar.sourceEncoding=UTF-8

# Coverage & Report Configurations
sonar.junit.reportPaths=target/surefire-reports
sonar.exclusions=**/*.html,**/*.css,**/*.js
